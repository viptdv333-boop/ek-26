# HTTP → HTTPS redirect
server {
    listen 80;
    server_name fomo.talk;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name fomo.talk;

    ssl_certificate /etc/letsencrypt/live/fomo.talk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fomo.talk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Telegram mobile auth page (served by API server)
    location /auth/telegram-mobile {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # SPA HTML pages (server-rendered with meta tags injected) — for SEO bots
    location = / {
        proxy_pass http://127.0.0.1:3100/__index;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static SPA assets and other paths (JS, CSS, images, SPA routes)
    location / {
        # First try server-rendered index for known SPA routes (HTML page requests)
        # Detect HTML requests by Accept header or path without extension.
        # Simpler: just serve static — client-side router handles paths.
        proxy_pass http://127.0.0.1:3180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SEO-critical SPA pages — serve via backend so meta tags are present in initial HTML
    location = /home { proxy_pass http://127.0.0.1:3100/__index; proxy_set_header Host $host; }
    location = /privacy { proxy_pass http://127.0.0.1:3100/__index; proxy_set_header Host $host; }
    location = /terms { proxy_pass http://127.0.0.1:3100/__index; proxy_set_header Host $host; }
    location = /auth { proxy_pass http://127.0.0.1:3100/__index; proxy_set_header Host $host; }
}
